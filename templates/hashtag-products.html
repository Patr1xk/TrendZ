<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendSpotter Malaysia - Hashtag Product Mapping</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/color-palette.css" rel="stylesheet">
    <style>
        body {
            background: var(--gradient-primary);
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .main-container {
            background: var(--bg-primary);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-xl);
            margin: var(--spacing-xl) auto;
            padding: var(--spacing-2xl);
            max-width: 1200px;
            backdrop-filter: blur(10px);
        }
        
        .header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
            padding-bottom: var(--spacing-lg);
            border-bottom: 3px solid var(--accent-royal-blue);
        }
        
        .hashtag-input {
            background: var(--solid-secondary);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
            color: var(--text-primary);
            box-shadow: var(--shadow-lg);
        }
        
        .hashtag-input input {
            border: none;
            border-radius: var(--radius-md);
            padding: var(--spacing-md) var(--spacing-lg);
            font-size: var(--font-size-lg);
            width: 100%;
            margin-bottom: var(--spacing-md);
            background: rgba(255, 255, 255, 0.9);
            color: var(--neutral-800);
        }
        
        .btn-search {
            background: var(--bg-primary);
            color: var(--accent-royal-blue);
            border: none;
            border-radius: var(--radius-md);
            padding: var(--spacing-md) var(--spacing-xl);
            font-weight: var(--font-weight-semibold);
            font-size: var(--font-size-base);
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-sm);
        }
        
        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            background: var(--neutral-100);
        }
        
        .product-card {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-lg);
            box-shadow: var(--shadow-md);
            border-left: 5px solid var(--accent-royal-blue);
            transition: all var(--transition-normal);
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-xl);
        }
        
        .product-image {
            width: 80px;
            height: 80px;
            background: var(--gradient-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-inverse);
            font-size: var(--font-size-2xl);
            margin-right: var(--spacing-lg);
        }
        
        .product-info h5 {
            color: var(--neutral-800);
            margin-bottom: var(--spacing-sm);
            font-weight: var(--font-weight-semibold);
        }
        
        .product-info p {
            color: var(--neutral-600);
            margin-bottom: var(--spacing-xs);
            font-size: var(--font-size-sm);
        }
        
        .price-tag {
            background: var(--gradient-secondary);
            color: var(--text-inverse);
            padding: var(--spacing-xs) var(--spacing-md);
            border-radius: var(--radius-xl);
            font-weight: var(--font-weight-semibold);
            font-size: var(--font-size-sm);
        }
        
        .trend-info {
            background: var(--gradient-primary);
            color: var(--text-inverse);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
            box-shadow: var(--shadow-lg);
        }
        
        .color-palette {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-sm);
        }
        
        .color-swatch {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid var(--text-inverse);
            box-shadow: var(--shadow-sm);
        }
        
        .loading {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--neutral-600);
        }
        
        .error {
            background: var(--error);
            color: var(--text-inverse);
            padding: var(--spacing-lg);
            border-radius: var(--radius-md);
            margin: var(--spacing-lg) 0;
            box-shadow: var(--shadow-md);
        }
        
        .quick-hashtags {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
            margin-top: var(--spacing-md);
        }
        
        .quick-hashtag {
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-inverse);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: all var(--transition-normal);
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
        }
        
        .quick-hashtag:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        
        .malaysia-badge {
            background: var(--gradient-secondary);
            color: var(--text-inverse);
            padding: var(--spacing-xs) var(--spacing-md);
            border-radius: var(--radius-xl);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-semibold);
            display: inline-block;
            margin: var(--spacing-xs) var(--spacing-xs) var(--spacing-xs) 0;
        }
        
        .application-tips {
            background: var(--neutral-50);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-top: var(--spacing-lg);
            border-left: 4px solid var(--accent-green);
        }
        
        .marketing-angles {
            background: rgba(37, 99, 235, 0.05);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-top: var(--spacing-lg);
            border-left: 4px solid var(--primary-blue);
        }
        
        .btn-outline-primary {
            border: 2px solid var(--primary-blue);
            color: var(--primary-blue);
            background: transparent;
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--radius-md);
            font-weight: var(--font-weight-medium);
            transition: all var(--transition-normal);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .btn-outline-primary:hover {
            background: var(--primary-blue);
            color: var(--text-inverse);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            text-decoration: none;
        }
        
        .header .text-end h1 {
            color: var(--neutral-800);
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
        }
        
        .header .text-end h4 {
            color: var(--accent-royal-blue);
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-medium);
        }
        
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="main-container">
            <div class="header">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="/" class="btn btn-outline-primary">
                        <i class="fas fa-arrow-left"></i> Back to Dashboard
                    </a>
                    <div class="text-end">
                        <h1 class="mb-0"><i class="fas fa-map-marked-alt"></i> TrendSpotter Malaysia</h1>
                        <h4 class="mb-0">Hashtag Product Mapping</h4>
                    </div>
                </div>
                <p class="text-muted">Click on trending hashtags to see L'Oréal product recommendations</p>
            </div>
            
            <div class="hashtag-input">
                <h4><i class="fas fa-hashtag"></i> Search Trending Hashtags</h4>
                <input type="text" id="hashtagInput" placeholder="Enter hashtag (e.g., BarbieMakeUp, NaturalMakeup, GlamMakeup)" class="form-control">
                <button class="btn btn-search" onclick="searchHashtag()">
                    <i class="fas fa-search"></i> Get Product Recommendations
                </button>
                
                <div class="quick-hashtags">
                    <span class="quick-hashtag" onclick="searchQuickHashtag('barbiemakeup')">#BarbieMakeUp</span>
                    <span class="quick-hashtag" onclick="searchQuickHashtag('barbiecore')">#BarbieCore</span>
                    <span class="quick-hashtag" onclick="searchQuickHashtag('naturalmakeup')">#NaturalMakeup</span>
                    <span class="quick-hashtag" onclick="searchQuickHashtag('cleangirl')">#CleanGirl</span>
                    <span class="quick-hashtag" onclick="searchQuickHashtag('glammakeup')">#GlamMakeup</span>
                    <span class="quick-hashtag" onclick="searchQuickHashtag('partyready')">#PartyReady</span>
                    <span class="quick-hashtag" onclick="searchQuickHashtag('glassskin')">#GlassSkin</span>
                    <span class="quick-hashtag" onclick="searchQuickHashtag('skincare')">#Skincare</span>
                </div>
            </div>
            
            <div id="results"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function searchQuickHashtag(hashtag) {
            document.getElementById('hashtagInput').value = hashtag;
            searchHashtag();
        }
        
        function searchHashtag() {
            const hashtag = document.getElementById('hashtagInput').value.trim();
            if (!hashtag) {
                alert('Please enter a hashtag');
                return;
            }
            
            const cleanHashtag = hashtag.replace('#', '');
            const resultsDiv = document.getElementById('results');
            
            // Show loading
            resultsDiv.innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p>Searching for #${cleanHashtag} product recommendations...</p>
                </div>
            `;
            
            // Make API call
            fetch(`/api/malaysia/hashtag-products/${encodeURIComponent(cleanHashtag)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        displayResults(data);
                    } else {
                        displayError(data.message);
                    }
                })
                .catch(error => {
                    displayError('Failed to fetch product recommendations: ' + error.message);
                });
        }
        
        function displayResults(data) {
            const recommendations = data.recommendations;
            const resultsDiv = document.getElementById('results');
            
            let html = `
                <div class="trend-info">
                    <h2><i class="fas fa-hashtag"></i> ${recommendations.hashtag}</h2>
                    <p class="lead">${recommendations.trend_description}</p>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <h5><i class="fas fa-palette"></i> Color Palette</h5>
                            <div class="color-palette">
                                ${recommendations.color_palette.map(color => 
                                    `<div class="color-swatch" style="background-color: ${getColorCode(color)}" title="${color}"></div>`
                                ).join('')}
                            </div>
                        </div>
                        <div class="col-md-6">
                            <h5><i class="fas fa-users"></i> Target Audience</h5>
                            <p>${recommendations.target_audience}</p>
                        </div>
                    </div>
                    
                    <div class="row mt-3">
                        <div class="col-md-6">
                            <h5><i class="fas fa-star"></i> Look Style</h5>
                            <p>${recommendations.look_style}</p>
                        </div>
                        <div class="col-md-6">
                            <h5><i class="fas fa-map-marker-alt"></i> Malaysia Relevance</h5>
                            <span class="malaysia-badge">${recommendations.malaysia_relevance}</span>
                        </div>
                    </div>
                </div>
                
                <h3><i class="fas fa-shopping-bag"></i> Recommended Products (${recommendations.total_products})</h3>
                <p class="text-muted">Estimated Cost: <strong>${recommendations.estimated_cost}</strong></p>
            `;
            
            // Display products
            recommendations.recommended_products.forEach(product => {
                html += `
                    <div class="product-card">
                        <div class="d-flex align-items-start">
                            <div class="product-image">
                                <i class="fas fa-box"></i>
                            </div>
                            <div class="product-info flex-grow-1">
                                <h5>${product.product_name}</h5>
                                <p><strong>Category:</strong> ${product.category}</p>
                                <p><strong>Description:</strong> ${product.description}</p>
                                <p><strong>Why it matches:</strong> ${product.match_reason}</p>
                                <p><strong>Application Tip:</strong> ${product.application_tip}</p>
                                
                                <div class="mt-3">
                                    <span class="price-tag">${product.price_range}</span>
                                    <span class="malaysia-badge">${product.availability} Availability</span>
                                    ${product.humidity_suitable ? '<span class="malaysia-badge">Humidity Suitable</span>' : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            // Application tips
            if (recommendations.application_tips && recommendations.application_tips.length > 0) {
                html += `
                    <div class="application-tips">
                        <h5><i class="fas fa-lightbulb"></i> Application Tips</h5>
                        <ul>
                            ${recommendations.application_tips.map(tip => `<li>${tip}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            // Marketing angles
            if (recommendations.marketing_angles && recommendations.marketing_angles.length > 0) {
                html += `
                    <div class="marketing-angles">
                        <h5><i class="fas fa-bullhorn"></i> Marketing Angles</h5>
                        <ul>
                            ${recommendations.marketing_angles.map(angle => `<li>${angle}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            resultsDiv.innerHTML = html;
        }
        
        function displayError(message) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="error">
                    <h5><i class="fas fa-exclamation-triangle"></i> Error</h5>
                    <p>${message}</p>
                </div>
            `;
        }
        
        function getColorCode(colorName) {
            const colorMap = {
                'Hot Pink': '#ff69b4',
                'Bubblegum Pink': '#ffc0cb',
                'Rose Gold': '#e8b4b8',
                'Bright Coral': '#ff7f50',
                'Barbie Pink': '#e0218a',
                'Coral': '#ff7f50',
                'Nude': '#f5deb3',
                'Beige': '#f5f5dc',
                'Soft Brown': '#d2b48c',
                'Natural Pink': '#ffb6c1',
                'Clear': '#ffffff',
                'Soft Pink': '#ffb6c1',
                'Natural': '#f5f5dc',
                'Gold': '#ffd700',
                'Bronze': '#cd7f32',
                'Deep Red': '#8b0000',
                'Black': '#000000',
                'Bold': '#ff6b6b',
                'Vibrant': '#ff4757',
                'Metallic': '#c0c0c0',
                'Shimmer': '#ffd700',
                'Dewy': '#f0e68c',
                'Translucent': '#ffffff',
                'Glowing': '#ffd700',
                'Healthy': '#90ee90',
                'Versatile': '#9370db',
                'Adaptable': '#20b2aa',
                'Trend-appropriate': '#ff6347'
            };
            return colorMap[colorName] || '#cccccc';
        }
        
        // Allow Enter key to search
        document.getElementById('hashtagInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchHashtag();
            }
        });
    </script>
</body>
</html>
